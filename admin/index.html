<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Panel · Sentirse Bien</title>
<meta name="theme-color" content="#2A1B3D">
<!-- Se puede instalar como app (solo el panel). Sin service worker: no se guardan datos de pacientes en el teléfono. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sentirse Bien">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="../assets/logo/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>
<header class="ad-head">
  <div class="ad-head-in">
    <span class="ad-brand">
      <img src="../assets/logo/emblema-oscuro.svg" alt="" width="40" height="40">
      <span><strong>Sentirse Bien</strong><small>Tu panel</small></span>
    </span>
    <a class="ad-site" href="../" target="_blank" rel="noopener">Ver la página</a>
  </div>
</header>

<div class="ad-shell">
  <nav class="ad-nav" id="ad-nav" aria-label="Secciones del panel" hidden>
    <button type="button" data-view="citas">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="3.5" width="15" height="17" rx="2.5"/><path d="M8 9l1.5 1.5L12 8M8 15l1.5 1.5L12 14M14.5 9.5H17M14.5 15.5H17"/></svg>
      <span>Citas</span><span class="nav-badge" id="nav-badge" hidden></span>
    </button>
    <button type="button" data-view="calendario">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="8.5" cy="14" r=".6"/><circle cx="12" cy="14" r=".6"/><circle cx="15.5" cy="14" r=".6"/><circle cx="8.5" cy="17.2" r=".6"/><circle cx="12" cy="17.2" r=".6"/></svg>
      <span>Calendario</span>
    </button>
    <button type="button" data-view="horarios">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
      <span>Horarios</span>
    </button>
    <button type="button" data-view="libres">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M5.6 18.4l1.6-1.6M16.8 7.2l1.6-1.6"/></svg>
      <span class="lbl-long">Días libres</span><span class="lbl-short">Libres</span>
    </button>
    <button type="button" data-view="ajustes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>
      <span>Ajustes</span>
    </button>
  </nav>

  <main class="ad-main" id="ad-root">
    <p class="muted" role="status">Cargando…</p>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<dialog class="dlg" id="dlg" aria-labelledby="dlg-t"></dialog>

<script type="module" src="../js/admin.js"></script>
</body>
</html>
